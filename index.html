<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>header</title>
    <link rel="shortcut icon" href="./fire.jpg" type="image/x-icon">
    <style>
       *{
        margin: auto;
        padding: 10px;
        box-sizing: border-box;
       }
       body { padding: 20px;
     }
nav{
    border: solid 1px;
    border-radius: 50px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    height: 80px;
    width: 100%;
    background-color: black;
}
.img {
    display: flex;
    align-items: center;
}

.img img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 50%;
    padding: 0;
    margin: 0;
    display: block;
}

a{
    color: whitesmoke;
font-size: large;
font-weight: bolder;

text-decoration: none;

}
a:hover{
    background-color: azure;
    color: black;
    border-radius: 50px;
}
.btn { display: flex;
     align-items: center;
     } 
     .btn button { 
        border: none;
         border-radius: 25px;
          background-color: aliceblue;
           color: black;
            padding: 8px 18px; 
            font-size: 14px; 
            font-weight: bold;
             cursor: pointer;
             }
              
   
    </style>
</head>
<body>
    <nav>
<div class="img">
    <img src="./fire.jpg" alt="">
</div>
        <div class="main">
            <a href="#">Home</a>
            <a href="#">Work</a>
            <a href="#">Prices</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </div>
        <div class="btn">
            <button>fire@email.com</button>
        </div>
    </nav>











</body>
</html>
